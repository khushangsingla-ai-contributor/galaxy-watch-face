name: Deploy gallery to Pages

# Publishes the watch-face gallery (docs/) to GitHub Pages whenever docs/
# changes on main. The gallery itself is generated locally by the pre-commit
# hook, so this workflow only deploys the already-committed docs/. When face
# modules change, build-faces.yml rebuilds APKs, refreshes the gallery, and
# deploys Pages with download links included.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
