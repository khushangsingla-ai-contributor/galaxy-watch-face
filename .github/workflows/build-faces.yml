name: Build watch-face APKs

# Builds installable release APKs for every face and uploads them as a GitHub
# Actions artifact. Run manually from the Actions tab (workflow_dispatch).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-faces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - name: Build APK artifacts
        run: ./scripts/build-artifacts.sh --output dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watch-face-apks
          path: dist/
          retention-days: 90
          if-no-files-found: error
