name: Build watch-face APKs

# Builds installable release APKs for every face, uploads them as a GitHub
# Actions artifact, and (on main) copies them into docs/downloads/ for the
# gallery Pages site.

on:
  push:
    branches: [main]
    paths:
      - "faces/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "scripts/build-artifacts.sh"
  pull_request:
    paths:
      - "faces/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "scripts/build-artifacts.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-faces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools

      - name: Build APK artifacts
        run: ./scripts/build-artifacts.sh --output dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watch-face-apks
          path: dist/
          retention-days: 90
          if-no-files-found: error

      - name: Stage gallery downloads (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/downloads
          cp dist/*.apk docs/downloads/
          node scripts/generate-gallery.mjs

      - name: Upload combined Pages artifact (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
